<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Green Turtle AI</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: linear-gradient(135deg, #0f766e, #164e63);
}

.container {
    width: 800px;
    margin: 20px auto;
    background: white;
    border-radius: 15px;
    overflow: hidden;
}

h1 {
    background: #0f766e;
    color: white;
    text-align: center;
    padding: 15px;
    margin: 0;
}

#chatBox {
    height: 450px;
    overflow-y: auto;
    padding: 15px;
    background: #f1f5f9;
}

.user-message {
    background: #0f766e;
    color: white;
    padding: 10px;
    margin: 10px;
    border-radius: 10px;
    text-align: right;
}

.bot-message {
    background: #e0f2fe;
    padding: 10px;
    margin: 10px;
    border-radius: 10px;
}

.input-area {
    display: flex;
    padding: 10px;
    background: white;
    border-top: 1px solid #ccc;
}

input {
    flex: 1;
    padding: 10px;
    border-radius: 20px;
    border: 1px solid #ccc;
}

button {
    margin-left: 5px;
    padding: 10px 15px;
    border: none;
    border-radius: 20px;
    background: #0f766e;
    color: white;
    cursor: pointer;
}

#loader {
    font-style: italic;
    opacity: 0.7;
    margin: 10px;
}
</style>

</head>

<body>

<div class="container">

    <!-- TOP BAR -->
    <div style="padding:10px; background:#e0f2fe; display:flex; justify-content:space-between; align-items:center;">
        
        <div>
            <h3 style="margin:0;">Welcome {{ user }}</h3>
            <a href="/history">📜 View Chat History</a>
        </div>

        <a href="/logout" style="text-decoration:none; font-weight:bold;">Logout</a>
    </div>

    <h1>🐢 Green Turtle AI</h1>

    <div id="chatBox">

        <div class="bot-message">Hello! How can I help you?</div>

        <!-- LOADER -->
        <div id="loader" class="bot-message" style="display:none;">
            🤖 Green Turtle AI is thinking...
        </div>

    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type here...">

        <button onclick="startVoice()">🎤</button>
        <button onclick="sendMessage()">Send</button>
        <button onclick="toggleVoice()">🔊</button>
    </div>

</div>

<script>

let recognition;
let lastResponse = "";
let isSpeaking = false;
let utterance = null;

/* ================= SEND MESSAGE ================= */
function sendMessage() {

    let userInput = document.getElementById("userInput");
    let userText = userInput.value.trim();
    if (!userText) return;

    let chatBox = document.getElementById("chatBox");

    // USER MESSAGE (SAFE)
    let userDiv = document.createElement("div");
    userDiv.className = "user-message";
    userDiv.innerText = userText;
    chatBox.appendChild(userDiv);

    userInput.value = "";

    // SHOW LOADER
    document.getElementById("loader").style.display = "block";

    chatBox.scrollTop = chatBox.scrollHeight;

    fetch("/send_message", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ message: userText })
    })
    .then(res => res.json())
    .then(data => {

        document.getElementById("loader").style.display = "none";

        if (data.error) {
            let errDiv = document.createElement("div");
            errDiv.className = "bot-message";
            errDiv.innerText = "⚠️ Please login first";
            chatBox.appendChild(errDiv);
            return;
        }

        lastResponse = data.response;

        // BOT MESSAGE (SAFE)
        let botDiv = document.createElement("div");
        botDiv.className = "bot-message";
        botDiv.innerText = data.response;
        chatBox.appendChild(botDiv);

        chatBox.scrollTop = chatBox.scrollHeight;
    })
    .catch(err => {
        document.getElementById("loader").style.display = "none";

        let errDiv = document.createElement("div");
        errDiv.className = "bot-message";
        errDiv.innerText = "⚠️ Server error. Try again.";
        chatBox.appendChild(errDiv);
    });
}


/* ================= ENTER KEY ================= */
document.getElementById("userInput").addEventListener("keypress", function(e){
    if (e.key === "Enter") sendMessage();
});


/* ================= VOICE INPUT ================= */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = "en-IN";

    recognition.onresult = function(event) {
        document.getElementById("userInput").value =
        event.results[0][0].transcript;
    };
}

function startVoice() {
    if (!recognition) {
        alert("Speech recognition not supported");
        return;
    }
    recognition.start();
}


/* ================= TEXT TO SPEECH ================= */
function speakText(text) {

    window.speechSynthesis.cancel();

    utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "en-IN";

    utterance.onend = () => {
        isSpeaking = false;
    };

    window.speechSynthesis.speak(utterance);
    isSpeaking = true;
}


/* ================= VOICE TOGGLE ================= */
function toggleVoice() {

    if (!lastResponse) return;

    if (!isSpeaking) {
        speakText(lastResponse);
        return;
    }

    window.speechSynthesis.cancel();
    isSpeaking = false;
}

</script>

</body>
</html>
